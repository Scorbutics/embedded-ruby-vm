services:
  # Main development environment
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        - INSTALL_CUSTOM_CERTS=true
    container_name: embedded-ruby-vm-dev
    volumes:
      # Named volume for source code (better performance than bind mounts on Windows)
      - source-code:/workspace
      # Named volume for Gradle cache (speeds up builds)
      - gradle-cache:/gradle-cache
      # Named volume for build artifacts
      - build-artifacts:/workspace/build
      # Named volume for kmp build artifacts
      - kmp-artifacts:/workspace/kmp/build
    environment:
      - GRADLE_USER_HOME=/gradle-cache
      - GRADLE_OPTS=-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true
      # Disables the Kotlin/Native linuxX64 target in dev (its bundled glibc 2.18 sysroot
      # can't link a libembedded-ruby.so produced from this container's modern glibc).
      # CI keeps the target enabled and patches ld.gold instead.
      - EMBEDDED_RUBY_VM_DEV=true
    # Use the host's network namespace directly (Linux only). Without this,
     # docker-proxy mediates TCP between host and container — and while it
     # passes a bare TCP handshake, it has been observed to drop the early
     # bytes of the rdbg protocol handshake, causing "Connection reset by
     # peer" on the client. Sharing the host's network namespace removes the
     # proxy entirely: the Ruby `debug` gem's listener binds on the host's
     # 127.0.0.1 directly, and a host-side `rdbg --attach` / VS Code Ruby
     # LSP attach reaches it byte-for-byte the same way an in-container
     # client would.
     #
     # Tradeoffs: Linux-only (Docker Desktop on Mac/Windows ignores this),
     # and the container has unrestricted access to the host's network
     # stack. Both are fine for a dev environment.
    network_mode: host
    working_dir: /workspace
    stdin_open: true
    tty: true
    command: tail -f /dev/null

  # Helper service to copy source code INTO the volume
  # Usage: docker-compose run --rm source-sync-in
  source-sync-in:
    image: alpine:latest
    volumes:
      - ./:/host-source:ro
      - source-code:/workspace
    command: sh -c "rm -rf /workspace/* /workspace/.* 2>/dev/null || true && cp -a /host-source/. /workspace/ && echo 'Source code synced to volume'"

  # Helper service to export build artifacts OUT of the volume
  # Usage: docker-compose run --rm artifact-export
  artifact-export:
    image: alpine:latest
    volumes:
      - build-artifacts:/build
      - kmp-artifacts:/kmp-build
      - ./docker-output:/output
    command: sh -c "
      mkdir -p /output/build /output/kmp-build &&
      cp -r /build/* /output/build/ 2>/dev/null || echo 'No root build artifacts' &&
      cp -r /kmp-build/* /output/kmp-build/ 2>/dev/null || echo 'No KMP build artifacts' &&
      echo 'Artifacts exported to ./docker-output directory' &&
      ls -lah /output/"

volumes:
  # Named volume for source code
  source-code:
    driver: local

  # Named volume for Gradle cache (persists between builds)
  gradle-cache:
    driver: local

  # Named volume for build outputs
  build-artifacts:
    driver: local

  # Named volume for KMP module build outputs
  kmp-artifacts:
    driver: local
